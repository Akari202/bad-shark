[package]
name = "bad-shark"
version = "0.1.2"
edition = "2024"
authors = ["Akari Harada <akaritwo0two@gmail.com>"]
repository = "https://github.com/Akari202/bad-shark"
license = "GPL-3"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
cfg-if = "1.0.4"
cgmath = "0.18.0"
eframe = { version = "0.33.3", features = ["persistence", "wgpu"] }
egui_logger = "0.9.2"
env_logger = "0.11.9"
itertools = "0.14.0"
log = "0.4.29"
pollster = "0.4.0"
rayon = "1.11.0"
serde = { version = "1.0.219", features = ["derive"] }
vec-utils = { path = "../vec-utils/vec-utils/", version = "0.3.1", features = [
  "matrix",
  "serde",
  "std"
] }
winit = { version = "0.30.12", features = ["rwh_05"] }
